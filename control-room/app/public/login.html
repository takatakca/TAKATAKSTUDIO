<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAKATAK · Salle de contrôle</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="auth">
  <main class="auth-card">
    <h1>TAKATAK <span>Salle de contrôle</span></h1>
    <p class="notice">Accès réservé. Chaque session est enregistrée : écrans et caméra.</p>

    <form id="password-step">
      <label>Compte
        <select name="username" required>
          <option value="takatak">Takatak</option>
          <option value="sheroz">Sheroz</option>
          <option value="abdullah">Abdullah</option>
        </select>
      </label>
      <label>Mot de passe
        <input name="password" type="password" autocomplete="current-password" required minlength="12">
      </label>
      <button type="submit">Recevoir mon code par texto</button>
    </form>

    <form id="code-step" hidden>
      <p id="code-hint"></p>
      <label>Code reçu par texto
        <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,10}" required>
      </label>
      <button type="submit">Entrer</button>
      <button type="button" id="restart" class="link">Recommencer</button>
    </form>

    <p id="message" role="alert"></p>
  </main>
  <script src="/assets/login.js"></script>
</body>
</html>
